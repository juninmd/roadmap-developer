[build]
  command = "npm ci && npm run docs:build"
  publish = ".vitepress/dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Site estático multipágina: URL inexistente deve devolver o 404.html do VitePress, não a home com 200.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
