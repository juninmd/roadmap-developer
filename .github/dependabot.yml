version: 2
updates:
  # Actions do base-actions consumidas via @main: manter os pins em dia aqui
  # (quebra de dependencia em cadeia de suprimentos e o risco de tags moveis).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

